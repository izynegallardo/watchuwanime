services:
    psql:
        image: postgres:17
        restart: unless-stopped
        env_file:
            - ./.env.local
        volumes:
            - data:/var/lib/postgresql/data
        ports:
            - '5432:5432'
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
            interval: 5s
            timeout: 5s
            retries: 5
        networks:
            - server-network

    backend:
        build:
            context: .
            dockerfile: Dockerfile
        depends_on:
            psql:
                condition: service_healthy
        env_file:
            - ./.env.local
        environment:
            DB_HOST: psql
        ports:
            - '3000:3000'
        networks:
            - server-network

volumes:
    data:

networks:
    server-network:
        driver: bridge
